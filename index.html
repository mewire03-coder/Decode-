<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Decoder</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; background: #eef1f5; color: #1c1c1c; }
  header { background: #1f3a5f; color: #fff; padding: 14px; text-align: center; font-size: 20px; border-bottom: 4px solid #d62b2b; }
  .wrap { padding: 12px; max-width: 520px; margin: auto; }
  #reader { width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
  button { width: 100%; padding: 14px; margin-top: 12px; font-size: 17px; border: none; border-radius: 10px; background: #1f3a5f; color: #fff; }
  .card { background: #fff; border-radius: 14px; padding: 14px; margin-top: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .snap { width: 100%; border-radius: 8px; margin-bottom: 10px; display: block; }
  .label { font-size: 13px; color: #666; text-align: right; margin-top: 8px; }
  .value { font-size: 17px; font-weight: bold; margin-bottom: 4px; text-align: right; overflow-wrap: anywhere; }
  .value.net { font-size: 24px; color: #1f3a5f; background: #dbe7f5; padding: 8px 10px; border-radius: 8px; margin: 6px 0; }
  .ok { border: 2px solid #2e7d32; }
  .ok h2 { margin: 6px 0 6px; color: #2e7d32; text-align: center; font-size: 22px; }
  .fake { background: #fde2e2; border: 2px solid #c0392b; color: #7a1c12; }
  .fake h2 { margin: 6px 0; color: #c0392b; text-align: center; font-size: 24px; }
  .badge-ok, .badge-x { width: 78px; height: 78px; border-radius: 50%; color: #fff; font-size: 46px; font-weight: bold; text-align: center; line-height: 78px; margin: 4px auto 6px; }
  .badge-ok { background: #2e7d32; box-shadow: 0 0 0 6px #e3f6e8; }
  .badge-x { background: #d62b2b; box-shadow: 0 0 0 6px #fbd3d3; }
  ul { padding-left: 18px; margin: 6px 0; text-align: right; }
  .blink { animation: blink 0.5s steps(2, start) 8; }
  @keyframes blink {
    0%, 100% { background: #fde2e2; }
    50% { background: #e53935; color: #fff; }
  }
  .blink h2 { animation: blinkText 0.5s steps(2, start) 8; }
  @keyframes blinkText {
    0%, 100% { color: #c0392b; }
    50% { color: #fff; }
  }
</style>
</head>
<body>
<header>Barcode Decoder and Verification</header>
<div class="wrap">
  <div id="reader"></div>
  <button id="toggle">Start camera</button>
  <div id="output"></div>
</div>

<script>
// ===== Master data (update as per your list) =====
const PRODUCTS = {
  '01': 'Mujahid enamelled wire',
  '02': 'Muslim enamelled wire'
};
const SUPERVISORS = {
  '01': 'Mr Sageer',
  '02': 'Saif Khan',
  '03': 'Nadeem Baig',
  '04': 'Mr Ramzan',
  '05': 'Jamel ur Rehman',
  '06': 'Jutt',
  '07': 'Mr Asger',
  '08': 'Mr Jameel'
};
const ENAMELS = {
  '01': 'Black Class F 155c°',
  '02': 'Golden Class F'
};
const FORMULATIONS = {
  '01': 'Taiwan {TW} F (155-175)c° -1',
  '02': 'Taiwan {TW} Golden -2',
  '03': 'Taiwan {TW} F(155-175)c° -3',
  '04': 'Germany {DE} class F -4'
};

// Small flag icons (SVG, so they look the same on every phone)
const FLAGS = {
  TW: '<svg width="20" height="14" viewBox="0 0 30 20" style="vertical-align:middle;border:1px solid #ccc;border-radius:2px"><rect width="30" height="20" fill="#fe0000"/><rect width="15" height="10" fill="#000095"/><circle cx="7.5" cy="5" r="3" fill="#fff"/></svg>',
  DE: '<svg width="20" height="14" viewBox="0 0 5 3" style="vertical-align:middle;border:1px solid #ccc;border-radius:2px"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#d00"/><rect y="2" width="5" height="1" fill="#ffce00"/></svg>'
};
function flagify(s) {
  return s.replace(/\{(TW|DE)\}/g, (m, c) => FLAGS[c]);
}

// ===== Sounds (generated in the browser, no files needed) =====
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, start, dur, type, vol) {
  const ac = getAudio();
  const o = ac.createOscillator();
  const g = ac.createGain();
  const t = ac.currentTime + start;
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g);
  g.connect(ac.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}

// Camera shutter click
function shutterSound() {
  const ac = getAudio();
  const len = Math.floor(ac.sampleRate * 0.08);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  const src = ac.createBufferSource();
  const g = ac.createGain();
  g.gain.value = 0.6;
  src.buffer = buf;
  src.connect(g);
  g.connect(ac.destination);
  src.start();
}

// OK sound for verified product (two beeps, low then high)
function successSound() {
  tone(880, 0, 0.15, 'sine', 0.3);
  tone(1320, 0.16, 0.25, 'sine', 0.3);
}

// "Ting ting" sound for fake or not matching product
function failSound() {
  tone(1000, 0, 0.3, 'triangle', 0.35);
  tone(1000, 0.4, 0.3, 'triangle', 0.35);
}

// ===== Snapshot from camera =====
function takeSnapshot() {
  const v = document.querySelector('#reader video');
  if (!v || !v.videoWidth) return null;
  const c = document.createElement('canvas');
  c.width = v.videoWidth;
  c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}

// ===== Helpers =====
function luhnValid(code) {
  let total = 0;
  for (let i = 0; i < code.length; i++) {
    let d = parseInt(code[code.length - 1 - i], 10);
    if (i % 2 === 1) {
      d *= 2;
      if (d > 9) d -= 9;
    }
    total += d;
  }
  return total % 10 === 0;
}

function decodeSwg(three) {
  const n = parseInt(three, 10);
  return n % 10 === 0 ? String(n / 10) : (n / 10).toFixed(1);
}

function formatDate(yymmdd) {
  const yy = parseInt(yymmdd.slice(0, 2), 10);
  const mm = parseInt(yymmdd.slice(2, 4), 10);
  const dd = parseInt(yymmdd.slice(4, 6), 10);
  return { mm, dd, text: `${String(dd).padStart(2,'0')}-${String(mm).padStart(2,'0')}-${2000 + yy}` };
}

// ===== Decode and verify =====
function checkCode(raw) {
  const code = String(raw).trim();
  const problems = [];

  if (!/^\d{30}$/.test(code)) {
    return { ok: false, problems: ['Barcode is not exactly 30 digits'] };
  }
  if (!luhnValid(code)) problems.push('Check digit is invalid');

  const productCode = code.slice(0, 2);
  const swgRaw = code.slice(2, 5);
  const enamelCode = code.slice(5, 7);
  const formCode = code.slice(7, 9);
  const supCode = code.slice(9, 11);
  const dateRaw = code.slice(11, 17);
  const netRaw = code.slice(17, 22);
  const spoolRaw = code.slice(22, 25);

  if (!PRODUCTS[productCode]) problems.push('Product code not in master list');
  if (!ENAMELS[enamelCode]) problems.push('Enamel code not in master list');
  if (!FORMULATIONS[formCode]) problems.push('Formulation code not in master list');
  if (!SUPERVISORS[supCode]) problems.push('Supervisor code not in master list');

  const d = formatDate(dateRaw);
  if (d.mm < 1 || d.mm > 12 || d.dd < 1 || d.dd > 31) problems.push('Date is invalid');

  const swg = parseInt(swgRaw, 10);
  if (swg < 10 || swg > 999) problems.push('SWG value is invalid');

  const netG = parseInt(netRaw, 10);
  if (netG <= 0) problems.push('Net weight is invalid');

  if (problems.length) return { ok: false, problems };

  const spoolG = parseInt(spoolRaw, 10);
  return {
    ok: true,
    details: {
      'Product': PRODUCTS[productCode],
      'SWG': decodeSwg(swgRaw),
      'Enamel type': ENAMELS[enamelCode],
      'Formulation': FORMULATIONS[formCode],
      'Supervisor': SUPERVISORS[supCode],
      'Date of manufacture': d.text,
      'Spool weight': spoolG + ' g',
      'Gross weight': ((netG + spoolG) / 1000).toFixed(3) + ' kg',
      'Net weight': (netG / 1000).toFixed(3) + ' kg'
    }
  };
}

// ===== Show result =====
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const readerEl = document.getElementById('reader');
const toggleBtn = document.getElementById('toggle');
const outEl = document.getElementById('output');

function showResult(raw) {
  // 1. Shutter click and snapshot of the scanned label
  shutterSound();
  const snap = takeSnapshot();
  const imgHtml = snap ? `<img class="snap" src="${snap}" alt="Scanned label">` : '';

  const r = checkCode(raw);

  // 2. Hide the camera and show the report
  stopCamera();
  readerEl.style.display = 'none';
  toggleBtn.style.display = 'none';

  if (!r.ok) {
    outEl.innerHTML = `
      <div class="card fake blink">
        ${imgHtml}
        <div class="badge-x">&#10005;</div>
        <h2>Fake product</h2>
        <ul>${r.problems.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
        <button onclick="scanAgain()">Scan again</button>
      </div>`;
    setTimeout(failSound, 250);
  } else {
    let rows = '';
    for (const [k, v] of Object.entries(r.details)) {
      const cls = k === 'Net weight' ? 'value net' : 'value';
      rows += `<div class="label">${esc(k)}</div><div class="${cls}">${flagify(esc(v))}</div>`;
    }
    outEl.innerHTML = `
      <div class="card ok">
        ${imgHtml}
        <div class="badge-ok">&#10003;</div>
        <h2>Verified product</h2>
        ${rows}
        <button onclick="scanAgain()">Scan again</button>
      </div>`;
    setTimeout(successSound, 250);
  }
}

// ===== Camera =====
let scanner = null;
let running = false;
let lastCode = null;
let lastTime = 0;

function onScan(text) {
  // Avoid reading the same code repeatedly
  const now = Date.now();
  if (text === lastCode && now - lastTime < 3000) return;
  lastCode = text;
  lastTime = now;
  showResult(text);
}

async function startCamera() {
  getAudio(); // unlock sound on user tap (required by browsers)
  if (!scanner) {
    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [ Html5QrcodeSupportedFormats.DATA_MATRIX, Html5QrcodeSupportedFormats.QR_CODE ],
      verbose: false
    });
  }
  try {
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 260 } },
      onScan,
      () => {}
    );
    running = true;
    toggleBtn.textContent = 'Stop camera';
  } catch (e) {
    outEl.innerHTML =
      `<div class="card fake"><h2>Camera could not be opened</h2><div>${esc(e)}</div><div>Allow camera access in the browser and open this page over HTTPS.</div></div>`;
  }
}

async function stopCamera() {
  if (running && scanner) {
    try { await scanner.stop(); } catch (e) {}
    running = false;
  }
}

function scanAgain() {
  lastCode = null;
  outEl.innerHTML = '';
  readerEl.style.display = 'block';
  toggleBtn.style.display = 'block';
  startCamera();
}

toggleBtn.addEventListener('click', async () => {
  if (running) {
    await stopCamera();
    toggleBtn.textContent = 'Start camera';
  } else {
    startCamera();
  }
});
</script>
</body>
</html>
